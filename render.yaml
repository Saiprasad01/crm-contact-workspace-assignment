services:
  - type: web
    name: crm-contacts-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npm run seed && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        value: file:./data/dev.db
      - key: CORS_ORIGIN
        sync: false
